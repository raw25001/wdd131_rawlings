<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <script src="java.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <img src="image (2).png" alt="Character Image" class="image">

    <div class="name">
      Snortleblat
    </div>

    <div class="stats">
      <p><strong>Class:</strong> <span id="class">Swamp Beast Diplomat</span></p>
      <p><strong>Level:</strong> <span id="level">5</span></p>
      <p><strong>Health:</strong> <span id="health">100</span></p>
    </div>

    <div class="buttons">
      <button id="attackBtn">Attack</button>
      <button id="levelBtn">Level Up</button>
    </div>
  </div>
          
</body>
</html>
